<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blank theme</title>
<link rel="stylesheet" href="docket-base.css">
<style>
.canvas .dumplines { justify-content: space-evenly; gap: 0.04in; }
</style>
</head>
<body>
<div class="sheet" style="gap: 0.11in;">

  <div class="masthead">
    <div>
      <div class="title">Blank docket</div>
      <div class="subtitle">for flu weeks and do-little days &mdash; this page is blank on purpose</div>
    </div>
    <div class="datebar">
      <div class="datefield">Date <span class="drule"></span></div>
    </div>
  </div>

  <div class="sec panel" style="flex:none;">
    <div class="counterrow">
      <span class="canlabel label-blue">Water</span>
      <div class="cup">1</div><div class="cup">2</div><div class="cup">3</div>
      <div class="cup">4</div><div class="cup">5</div><div class="cup">6</div>
      <div class="hint">sips count</div>
    </div>
    <div class="mmrow">
      <span class="canlabel label-coral">Meds</span>
      <div class="slot mm-what"></div>
      <div class="slot mm-time"></div>
      <div class="cbx cbx-sm"></div>
      <div class="cbx cbx-sm"></div>
      <div class="cbx cbx-sm"></div>
      <div class="hint">one box per dose</div>
    </div>
  </div>

  <div class="canvas">
    <div class="hint" style="margin-bottom: 0.06in;">scratch space &mdash; note it, doodle it, ignore it</div>
    <div class="dumplines">
      <div class="dumpline"></div>
      <div class="dumpline"></div>
      <div class="dumpline"></div>
      <div class="dumpline"></div>
      <div class="dumpline"></div>
      <div class="dumpline"></div>
      <div class="dumpline"></div>
      <div class="dumpline"></div>
      <div class="dumpline"></div>
      <div class="dumpline"></div>
      <div class="dumpline"></div>
      <div class="dumpline"></div>
    </div>
  </div>

  <div class="footer footer-calm">Done is done. Being sick is a job; you did it.</div>

</div>
</body>
</html>
